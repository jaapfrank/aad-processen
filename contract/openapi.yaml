        gebruiksrechtenBevestigd: { type: boolean, const: true }

    AssuranceFrameworkDraftPublish:
      type: object
      additionalProperties: false
      required:
        [expectedRevision, bronGecontroleerd, rechtenGecontroleerd,
         highLevelBeperkingGeaccepteerd]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        bronGecontroleerd: { type: boolean, const: true }
        rechtenGecontroleerd: { type: boolean, const: true }
        highLevelBeperkingGeaccepteerd:
          type: boolean
          const: true
          description: >
            Bevestigt dat dit concept zonder geverifieerde clausulelocators
            geen volledige normdekking bewijst.

    AssuranceFrameworkDraftReject:
      type: object
      additionalProperties: false
      required: [expectedRevision, reden]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        reden: { type: string, minLength: 10, maxLength: 1000 }

    AssuranceFrameworkDraft:
      type: object
      additionalProperties: false
      required:
        [draftId, status, kaderId, naam, editie, domein, bronUrl,
         bronOrganisatie, publiekeSamenvatting, gebruiksrechtenBevestigd,
         schemaVersion, provider, model, inputHash, outputHash, vragen,
         aangemaaktDoor, aangemaaktOp, revision, disclaimer]
      properties:
        draftId: { type: string, pattern: "^[0-9a-f]{32}$" }
        status: { type: string, enum: [concept, published, rejected] }
        kaderId: { type: string, pattern: "^custom-[a-z0-9-]+$" }
        naam: { type: string }
        editie: { type: string }
        domein: { type: string }
        bronUrl: { type: string, format: uri, pattern: "^https://" }
        bronOrganisatie: { type: string }
        publiekeSamenvatting: { type: string, maxLength: 4000 }
        gebruiksrechtenBevestigd: { type: boolean, const: true }
        schemaVersion: { type: string, const: assurance-framework-draft.v1 }
        provider: { type: string }
        model: { type: string }
        inputHash: { type: string, pattern: "^[0-9A-Fa-f]{64}$" }
        outputHash: { type: string, pattern: "^[0-9A-Fa-f]{64}$" }
        vragen:
          type: array
          minItems: 3
          maxItems: 15
          items: { $ref: "#/components/schemas/AssuranceFrameworkDraftQuestion" }
        aangemaaktDoor: { type: string }
        aangemaaktOp: { type: string, format: date-time }
        gepubliceerdDoor: { type: string }
        gepubliceerdOp: { type: string, format: date-time }
        bronGecontroleerdOp: { type: string, format: date-time }
        rechtenGecontroleerdOp: { type: string, format: date-time }
        afgewezenDoor: { type: string }
        afgewezenOp: { type: string, format: date-time }
        afwijsreden: { type: string, maxLength: 1000 }
        revision: { type: integer, minimum: 1 }
        disclaimer:
          type: string
          description: High-level custom hulpmiddel; geen volledige normdekking of certificeringsclaim.

    AssuranceFrameworkId:
      type: string
      pattern: "^(?:iso9001|iso27001|iso14001|iso45001|iso22301|bpmn20|nis2|avg|custom-[a-z0-9-]+)$"
      description: Vast publiek kader-id of expliciet gepubliceerd custom kader-id.

    AssuranceFrameworkQuestion:
      type: object
      additionalProperties: false
      required: [id, titel, vraag, bewijsHint]
      properties:
        id: { type: string }
        titel: { type: string }
        vraag: { type: string }
        bewijsHint: { type: string }

    AssuranceFramework:
      type: object
      additionalProperties: false
      required:
        [id, naam, editie, domein, type, bronUrl, bronOrganisatie,
         bronGecontroleerdOp, actief, vragen]
      properties:
        id: { $ref: "#/components/schemas/AssuranceFrameworkId" }
        naam: { type: string }
        editie: { type: string }
        domein: { type: string }
        type:
          type: string
          enum: [standard, law, regulation, notation, custom]
        bronUrl: { type: string, format: uri }
        bronOrganisatie: { type: string }
        bronGecontroleerdOp: { type: string, format: date }
        actief: { type: boolean }
        vragen:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AssuranceFrameworkQuestion" }

    AssuranceFrameworkCatalog:
      type: object
      additionalProperties: false
      required: [catalogVersion, kaders]
      properties:
        catalogVersion: { type: string }
        kaders:
          type: array
          items: { $ref: "#/components/schemas/AssuranceFramework" }

    AssuranceSettingsUpdate:
      type: object
      additionalProperties: false
      required: [expectedRevision, actieveKaderIds, aangevraagdIntervalUren]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        actieveKaderIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/AssuranceFrameworkId" }
        aangevraagdIntervalUren:
          type: integer
          enum: [24, 168, 720]

    AssuranceSettings:
      type: object
      additionalProperties: false
      required:
        [actieveKaderIds, aangevraagdIntervalUren, effectiefIntervalUren,
         maximaalIntervalUren, toegestaneIntervalUren, monitoringActief,
         volgendeRunOp, bijgewerktOp, bijgewerktDoor, revision]
      properties:
        actieveKaderIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/AssuranceFrameworkId" }
        aangevraagdIntervalUren: { type: integer, enum: [24, 168, 720] }
        effectiefIntervalUren: { type: integer, enum: [24, 168, 720] }
        maximaalIntervalUren: { type: integer, const: 720 }
        toegestaneIntervalUren:
          type: array
          prefixItems:
            - { type: integer, const: 24 }
            - { type: integer, const: 168 }
            - { type: integer, const: 720 }
          minItems: 3
          maxItems: 3
        monitoringActief: { type: boolean, const: true }
        volgendeRunOp: { type: string, format: date-time }
        bijgewerktOp: { type: string, format: date-time }
        bijgewerktDoor: { type: string }
        revision: { type: integer, minimum: 1 }

    AssuranceQuestionnaireStart:
      type: object
      additionalProperties: false
      required: [kaderId]
      properties:
        kaderId: { $ref: "#/components/schemas/AssuranceFrameworkId" }

    AssuranceQuestionnaireOutcome:
      type: string
      enum: [ja, deels, nee, onbekend, nvt]

    AssuranceQuestionnaireAnswerRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, vraagId, uitkomst]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        vraagId: { type: string }
        uitkomst: { $ref: "#/components/schemas/AssuranceQuestionnaireOutcome" }
        bewijsreferentie: { type: string, maxLength: 500 }
        motivatie: { type: string, maxLength: 2000 }

    AssuranceQuestionnaireAnswer:
      type: object
      additionalProperties: false
      required: [vraagId, uitkomst, beantwoordDoor, beantwoordOp]
      properties:
        vraagId: { type: string }
        uitkomst: { $ref: "#/components/schemas/AssuranceQuestionnaireOutcome" }
        bewijsreferentie: { type: string, maxLength: 500 }
        motivatie: { type: string, maxLength: 2000 }
        beantwoordDoor: { type: string }
        beantwoordOp: { type: string, format: date-time }

    AssuranceReadiness:
      type: object
      additionalProperties: false
      required:
        [beantwoord, totaal, ja, deels, nee, onbekend, nvt,
         bewijsGereed, open, disclaimer]
      properties:
        beantwoord: { type: integer, minimum: 0 }
        totaal: { type: integer, minimum: 1 }
        ja: { type: integer, minimum: 0 }
        deels: { type: integer, minimum: 0 }
        nee: { type: integer, minimum: 0 }
        onbekend: { type: integer, minimum: 0 }
        nvt: { type: integer, minimum: 0 }
        bewijsGereed: { type: integer, minimum: 0 }
        open: { type: integer, minimum: 0 }
        disclaimer: { type: string }

    AssuranceQuestionnaire:
      type: object
      additionalProperties: false
      required:
        [sessionId, kaderId, kaderNaam, catalogVersion, status, gestartDoor,
         gestartOp, revision, vragen, antwoorden, readiness]
      properties:
        sessionId: { type: string, pattern: "^[0-9a-f]{32}$" }
        kaderId: { $ref: "#/components/schemas/AssuranceFrameworkId" }
        kaderNaam: { type: string }
        catalogVersion: { type: string }
        status: { type: string, enum: [open, gereed] }
        gestartDoor: { type: string }
        gestartOp: { type: string, format: date-time }
        afgerondOp: { type: string, format: date-time }
        revision: { type: integer, minimum: 1 }
        vragen:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AssuranceFrameworkQuestion" }
        antwoorden:
          type: array
          items: { $ref: "#/components/schemas/AssuranceQuestionnaireAnswer" }
        readiness: { $ref: "#/components/schemas/AssuranceReadiness" }

    AssuranceFinding:
      type: object
      additionalProperties: false
      required: [id, type, ernst, titel, bericht]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        kaderId: { $ref: "#/components/schemas/AssuranceFrameworkId" }
        procesId: { type: string }
        vraagId: { type: string }
        type:
          type: string
          enum:
            [assessment-ontbreekt, assessment-onvolledig, assessment-gap,
             proces-eigenaar-ontbreekt, proces-review-ontbreekt,
             proces-review-verlopen]
        ernst: { type: string, enum: [info, waarschuwing, fout] }
        titel: { type: string }
        bericht: { type: string }

    AssuranceRun:
      type: object
      additionalProperties: false
      required:
        [runId, trigger, status, catalogVersion, kaderIds, gestartDoor,
         gestartOp, findingCount, bevindingen]
      properties:
        runId: { type: string, pattern: "^[0-9a-f]{32}$" }
        trigger: { type: string, enum: [handmatig, gepland] }
        status: { type: string, enum: [running, completed, failed] }
        catalogVersion: { type: string }
        kaderIds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AssuranceFrameworkId" }
        gestartDoor: { type: string }
        gestartOp: { type: string, format: date-time }
        afgerondOp: { type: string, format: date-time }
        findingCount: { type: integer, minimum: 0 }
        foutcode: { type: string }
        bevindingen:
          type: array
          items: { $ref: "#/components/schemas/AssuranceFinding" }

    AssuranceMonitoringStatus:
      type: object
      additionalProperties: false
      required:
        [monitoringActief, achterstallig, volgendeRunOp,
         effectiefIntervalUren, actieveKaderIds, gegenereerdOp]
      properties:
        monitoringActief: { type: boolean, const: true }
        achterstallig: { type: boolean }
        volgendeRunOp: { type: string, format: date-time }
        effectiefIntervalUren: { type: integer, enum: [24, 168, 720] }
        actieveKaderIds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AssuranceFrameworkId" }
        laatsteRun: { $ref: "#/components/schemas/AssuranceRun" }
        gegenereerdOp: { type: string, format: date-time }

    IsoNorm:
      type: string
      enum: [iso27001, iso9001, iso14001]

    IsoProcesRol:
      type: string
      enum: [kern, ondersteunend]

    IsoMapping:
      type: object
      required: [norm, rol]
      properties:
        norm: { $ref: "#/components/schemas/IsoNorm" }
        clausules:
          type: array
          items: { type: string }
        rol: { $ref: "#/components/schemas/IsoProcesRol" }
        toelichting: { type: string }

    ProcessGovernance:
      type: object
      properties:
        eigenaar: { type: string }
        herzieningsinterval: { type: string }
        laatsteReview: { type: string, format: date }
        volgendeReview: { type: string, format: date }

    AuditFramework:
      type: string
      enum: [iso9001, iso27001, iso14001, iso45001, iso22301, bpmn20]

    AuditConfirmationOutcome:
      type: string
      enum: [voldoet, actie-nodig, niet-van-toepassing]

    AuditAssessmentStartRequest:
      type: object
      required: [kaderId]
      properties:
        kaderId: { $ref: "#/components/schemas/AuditFramework" }

    AuditAssessmentStart:
      type: object
      required:
        [assessmentId, procesId, kaderId, gestartDoorId, gestartDoor, gestartOp,
         verlooptOp, processRevision, catalogVersion]
      properties:
        assessmentId:
          type: string
          pattern: "^[0-9a-f]{32}$"
        procesId: { type: string }
        kaderId: { $ref: "#/components/schemas/AuditFramework" }
        gestartDoorId: { type: string }
        gestartDoor: { type: string }
        gestartOp: { type: string, format: date-time }
        verlooptOp: { type: string, format: date-time }
        processRevision: { type: integer, minimum: 1 }
        catalogVersion: { type: string }

    AuditConfirmationRequest:
      type: object
      required:
        [assessmentId, expectedRevision, kaderId, controleId, uitkomst, toelichting]
      properties:
        assessmentId:
          type: string
          pattern: "^[0-9a-f]{32}$"
        expectedRevision: { type: integer, minimum: 1 }
        kaderId: { $ref: "#/components/schemas/AuditFramework" }
        controleId:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,79}$"
        uitkomst: { $ref: "#/components/schemas/AuditConfirmationOutcome" }
        toelichting: { type: string, minLength: 10, maxLength: 2000 }
        bewijsreferentie:
          type: string
          maxLength: 500
          description: Verplicht wanneer uitkomst 'voldoet' is.

    AuditConfirmation:
      type: object
      required:
        [assessmentId, catalogVersion, kaderId, controleId, uitkomst, toelichting,
         bevestigdDoorId, bevestigdDoor, bevestigdOp, processRevision]
      properties:
        assessmentId:
          type: string
          pattern: "^[0-9a-f]{32}$"
        catalogVersion: { type: string }
        kaderId: { $ref: "#/components/schemas/AuditFramework" }
        controleId:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,79}$"
        uitkomst: { $ref: "#/components/schemas/AuditConfirmationOutcome" }
        toelichting: { type: string, minLength: 10, maxLength: 2000 }
        bewijsreferentie: { type: string, maxLength: 500 }
        bevestigdDoorId: { type: string }
        bevestigdDoor: { type: string }
        bevestigdOp: { type: string, format: date-time }
        processRevision: { type: integer, minimum: 1 }

    IsoProcessConfig:
      type: object
      required: [procesId, mappings]
      properties:
        procesId: { type: string }
        mappings:
          type: array
          items: { $ref: "#/components/schemas/IsoMapping" }
        governance: { $ref: "#/components/schemas/ProcessGovernance" }
        auditBevestigingen:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/AuditConfirmation" }

    BorgingSignaal:
      type: string
      enum: [geen-eigenaar, review-verlopen, geen-live-versie, clausule-niet-gedekt]

    BorgingIssue:
      type: object
      required: [procesId, signaal, ernst, bericht]
      properties:
        procesId: { type: string }
        norm: { $ref: "#/components/schemas/IsoNorm" }
        signaal: { $ref: "#/components/schemas/BorgingSignaal" }
        ernst: { type: string, enum: [info, waarschuwing, fout] }
        bericht: { type: string }

    IsoMatrixRow:
      type: object
      required: [procesId, hoofdproces, detailproces, norm, rol, clausules, status, borging]
      properties:
        procesId: { type: string }
        hoofdproces: { type: string }
        detailproces: { type: string }
        norm: { $ref: "#/components/schemas/IsoNorm" }
        rol: { $ref: "#/components/schemas/IsoProcesRol" }
        clausules:
          type: array
          items: { type: string }
        eigenaar: { type: string }
        status: { $ref: "#/components/schemas/ProcessStatus" }
        laatsteReview: { type: string, format: date }
        volgendeReview: { type: string, format: date }
        borging:
          type: array
          items: { $ref: "#/components/schemas/BorgingIssue" }

    IsoOverview:
      type: object
      required: [hoofdprocessen, rijen, signalen, gegenereerdOp]
      properties:
        norm: { $ref: "#/components/schemas/IsoNorm" }
        hoofdprocessen:
          type: array
          items: { type: string }
        rijen:
          type: array
          items: { $ref: "#/components/schemas/IsoMatrixRow" }
        signalen:
          type: array
          items: { $ref: "#/components/schemas/BorgingIssue" }
        gegenereerdOp: { type: string, format: date-time }
