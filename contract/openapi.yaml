openapi: 3.1.0
info:
  title: Service Procesgids API
  version: "1.15.0"
  description: >
    Gedeeld API-contract tussen frontend (Claude) en backend (Codex).
    De schema's spiegelen /contract/model.ts (bron van waarheid).
    Status: v1.15 — development-session, AI Process Steward en brongebonden
    high-level kaderconcepten zijn expliciete, begrensde capabilities.
    Privacybewuste AI-traces registreren metadata en hashes; een custom kader
    vereist afzonderlijke menselijke publicatie en activering.
servers:
  - url: /api
    description: Relatief aan de host; de backend serveert ook de frontend-build.

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: Config
  - name: Auth
  - name: Admin
  - name: Processen
  - name: Werkruimte
  - name: Workflow
  - name: Suggesties
  - name: Import
  - name: Uitwisseling
  - name: Bestanden
  - name: ISO
  - name: Assurance
  - name: AI

paths:
  /health:
    get:
      summary: Liveness; bevestigt dat het serverproces verzoeken verwerkt.
      security: []
      responses:
        "200": { description: Serverproces actief. }
  /health/ready:
    get:
      summary: Readiness na initialisatie; controleert de databaseverbinding.
      security: []
      responses:
        "200": { description: Database bereikbaar en serverinitialisatie voltooid. }
        "503": { description: Database niet bereikbaar. }
  /config:
    get:
      tags: [Config]
      summary: Actieve modi van de app (auth/storage/online).
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfig" }

  /me:
    get:
      tags: [Auth]
      summary: Huidige gebruiker met effectieve rollen.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Inloggen in zelfstandige modus (authMode=local).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gebruikersnaam, wachtwoord]
              properties:
                gebruikersnaam: { type: string }
                wachtwoord: { type: string, format: password }
      responses:
        "200":
          description: Ingelogd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Meer dan 20 loginpogingen per client-IP binnen één minuut. }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Uitloggen.
      responses:
        "204": { description: Uitgelogd }

  /auth/development-session:
    post:
      tags: [Auth]
      summary: Tijdelijke loopback-only testsessie in een expliciete Debug/Development-runtime.
      description: >
        Alleen beschikbaar wanneer de server developmentLoginAvailable meldt.
        Vereist de header X-SPG-Development-Session: 1 en geeft nooit een
        persistente productiecredential uit.
      security: []
      parameters:
        - name: X-SPG-Development-Session
          in: header
          required: true
          schema: { type: string, const: "1" }
      responses:
        "200":
          description: Tijdelijke lokale testsessie geopend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users:
    get:
      tags: [Admin]
      summary: Lokale gebruikers ophalen. Alleen authMode=local; vereist rol 'beheren'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LocalUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Lokale gebruiker aanmaken. Alleen authMode=local; vereist rol 'beheren'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalUserCreateRequest" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Admin]
      summary: Eén lokale gebruiker ophalen. Alleen authMode=local; vereist rol 'beheren'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Admin]
      summary: Lokale gebruiker wijzigen. Alleen authMode=local; vereist rol 'beheren'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalUserUpdateRequest" }
      responses:
        "200":
          description: Bijgewerkt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{id}/password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Admin]
      summary: Wachtwoord van lokale gebruiker wijzigen. Alleen authMode=local; vereist rol 'beheren'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalPasswordChangeRequest" }
      responses:
        "200":
          description: Bijgewerkt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /processes:
    get:
      tags: [Processen]
      summary: Lijst van de laatste goedgekeurde procespublicaties.
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ProcessStatus" }
        - name: q
          in: query
          description: Vrije zoekterm.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProcessSummary" }
    post:
      tags: [Processen]
      summary: Nieuw proces aanmaken (status 'concept'). Vereist rol 'bewerken'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Process" }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Process" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /processes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Processen]
      summary: Laatste goedgekeurde publicatie van één proces.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Process" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Processen]
      summary: Proces wijzigen (maakt een nieuwe conceptversie). Vereist rol 'bewerken'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Process" }
      responses:
        "200":
          description: Bijgewerkt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Process" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Processen]
      summary: Proces verwijderen/archiveren. Vereist rol 'beheren'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "204": { description: Verwijderd }
        "403": { $ref: "#/components/responses/Forbidden" }

  /workspace/processes:
    get:
      tags: [Werkruimte]
      summary: Actuele werkversies voor redacteuren en goedkeurders.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ProcessStatus" }
        - name: q
          in: query
          description: Vrije zoekterm.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProcessSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /workspace/processes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Werkruimte]
      summary: Actuele werkversie van één proces.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Process" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /processes/{id}/health:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Processen]
      summary: Gezondheid van de actuele werkversie. Vereist een redactierol.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /processes/{id}/ai/maintenance-analysis:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [AI]
      summary: Analyseer één opgeslagen procesrevisie voor onderhoud.
      description: >
        Levert vragen, stapbevindingen en uitsluitend whitelisted
        tekstwijzigingen. De route muteert of publiceert het proces nooit.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcessMaintenanceAnalysisRequest" }
      responses:
        "200":
          description: Gestructureerde, server-gevalideerde onderhoudsanalyse.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessMaintenanceAnalysis" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503":
          description: AI is niet expliciet geconfigureerd.

  /processes/{id}/ai/runs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [AI]
      summary: Geef de privacybewuste AI-runhistorie van één proces.
      description: >
        Retourneert uitsluitend runmetadata, hashes, aantallen en eventuele
        gebruikersfeedback. Prompts, procesinhoud, antwoorden en ruwe
        modeluitvoer worden niet opgeslagen of geretourneerd.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Nieuwste runs eerst.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiRun" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: De opgeslagen runmetadata kan niet veilig worden gelezen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /processes/{id}/ai/runs/{runId}/feedback:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: runId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-fA-F]{32}$" } }
    post:
      tags: [AI]
      summary: Beoordeel een afgerond AI-wijzigingsvoorstel éénmalig.
      description: >
        Dezelfde genormaliseerde feedback mag door dezelfde actor idempotent
        worden herhaald. Een beoordeling van een andere actor, een afwijkende
        tweede beoordeling of een gewijzigde/gearchiveerde procesrevisie
        resulteert in 409. Geaccepteerde wijziging-id's moeten door deze run
        zijn voorgesteld.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiRunFeedbackRequest" }
      responses:
        "200":
          description: De run met de vastgelegde feedback.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503":
          description: De runmetadata kon niet veilig worden gelezen of opgeslagen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /processes/{id}/submit:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Workflow]
      summary: De bekeken conceptrevisie indienen ter goedkeuring. Vereist rol 'bewerken'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowRevisionRequest" }
      responses:
        "200":
          description: Ingediend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        "400": { description: De bekeken revisie ontbreekt of het verzoek is ongeldig. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /processes/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Workflow]
      summary: Exact de bekeken reviewrevisie goedkeuren en live zetten. Vereist rol 'goedkeuren'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowRevisionRequest" }
      responses:
        "200":
          description: Live gezet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        "400": { description: De bekeken revisie ontbreekt of het verzoek is ongeldig. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /processes/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Workflow]
      summary: De bekeken reviewrevisie afwijzen en terugzetten naar concept. Vereist rol 'goedkeuren'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                reden: { type: string }
      responses:
        "200":
          description: Afgewezen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        "400": { description: De bekeken revisie ontbreekt of het verzoek is ongeldig. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /processes/{id}/versions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Workflow]
      summary: Volledige versiehistorie van de werkversie. Vereist een redactierol.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Version" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /processes/{id}/versions/{v}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: v, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Workflow]
      summary: Eén specifieke werkversie als volledig proces. Vereist een redactierol.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Process" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /processes/{id}/diff:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: from, in: query, required: true, schema: { type: integer } }
      - { name: to, in: query, required: true, schema: { type: integer } }
    get:
      tags: [Workflow]
      summary: Verschil tussen twee werkversies (per stap). Vereist een redactierol.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiffReport" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /processes/{id}/steps/{stepId}/suggestions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: stepId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Suggesties]
      summary: Suggestie indienen bij een stap. Vereist rol 'suggesties'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, tekst]
              properties:
                type: { $ref: "#/components/schemas/SuggestionType" }
                tekst: { type: string }
      responses:
        "201":
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suggestion" }

  /suggestions:
    get:
      tags: [Suggesties]
      summary: Openstaande suggesties (voor redacteuren/beheerders).
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SuggestionStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Suggestion" }

  /suggestions/{id}/resolve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Suggesties]
      summary: Suggestie afhandelen (verwerkt/afgewezen). Vereist rol 'bewerken'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/SuggestionStatus" }
      responses:
        "200":
          description: Bijgewerkt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suggestion" }

  /import/pdf:
    post:
      tags: [Import]
      summary: PDF uploaden en een import-job starten. Vereist rol 'bewerken'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bestand]
              properties:
                bestand: { type: string, format: binary }
      responses:
        "202":
          description: Job gestart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }

  /import/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Import]
      summary: Status + resultaat van een import-job (concept + zekerheidsscores).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }

  /import/{jobId}/commit:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Import]
      summary: Gecorrigeerde import vastleggen als conceptproces. Vereist rol 'bewerken'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Process" }
      responses:
        "201":
          description: Conceptproces aangemaakt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Process" }

  /processes/{id}/export:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Uitwisseling]
      summary: Actuele werkversie exporteren als JSON. Vereist een redactierol.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Process" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /processes/import-json:
    post:
      tags: [Uitwisseling]
      summary: Proces importeren uit JSON. Vereist rol 'bewerken'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Process" }
      responses:
        "201":
          description: Geïmporteerd
          content:
            application/json:
            schema: { $ref: "#/components/schemas/Process" }

  /diagrams/lucid/export:
    post:
      tags: [Uitwisseling]
      summary: Proces exporteren als bewerkbaar Lucid Standard Import-package.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Process" }
      responses:
        "200":
          description: Bewerkbaar .lucid ZIP-package
          content:
            x-application/vnd.lucid.standardImport:
              schema: { type: string, format: binary }
        "400":
          description: Proces kon niet veilig worden geëxporteerd

  /diagrams/lucid/import:
    post:
      tags: [Uitwisseling]
      summary: Lucid Standard Import-package analyseren; nooit direct opslaan.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bestand]
              properties:
                bestand: { type: string, format: binary }
      responses:
        "200":
          description: Importreview, ook wanneer ok=false
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagramPackageImportResult" }

  /diagrams/visio/import:
    post:
      tags: [Uitwisseling]
      summary: Macro-vrije VSDX veilig analyseren; ondersteunt SPG-metadata en een expliciete éénpagina-swimlane-flowchartsubset.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - name: pageId
          in: query
          required: false
          schema: { type: string }
          description: Expliciet gekozen Visio-pagina uit de importreview.
        - name: defaultRole
          in: query
          required: false
          schema: { type: string }
          description: Door de gebruiker bevestigde procesrol wanneer de pagina geen swimlanes bevat.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bestand]
              properties:
                bestand: { type: string, format: binary }
      responses:
        "200":
          description: Importreview, ook wanneer ok=false
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagramPackageImportResult" }

  /diagrams/visio/export:
    post:
      tags: [Uitwisseling]
      summary: Een macro-vrije, bewerkbare éénpagina-VSDX uit het proces en de persistente diagramlayout maken.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Process" }
      responses:
        "200":
          description: Macro-vrije Microsoft Visio Drawing
          content:
            application/vnd.ms-visio.drawing:
              schema: { type: string, format: binary }
        "400":
          description: Proces kon niet veilig binnen de ondersteunde VSDX-subset worden geëxporteerd

  /diagrams/visio/export-capability:
    get:
      tags: [Uitwisseling]
      summary: Typed status van de Visio-exportcapability.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Actuele exportstatus en resterende runtime-reviewkanttekening
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagramExportBlocker" }

  /files/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Bestanden]
      summary: Origineel bronbestand (bv. de gekoppelde PDF) ophalen.
      responses:
        "200":
          description: OK
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/assurance-settings:
    get:
      tags: [Assurance]
      summary: Niet-verzwakbare continue-assurance-instellingen ophalen.
      description: Monitoring staat altijd aan; 720 uur is de maximale toegestane tussenruimte.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Actuele instellingen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssuranceSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Assurance]
      summary: Actieve kaders en een gelijk of strenger controle-interval instellen.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssuranceSettingsUpdate" }
      responses:
        "200":
          description: Bijgewerkt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssuranceSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/assurance-framework-drafts:
    get:
      tags: [Assurance]
      summary: AI-kaderconcepten en menselijke besluiten ophalen.
      description: >
        Alleen voor beheerders. Concepten zijn high-level hulpmiddelen en
        bewijzen zonder geverifieerde bronlocators geen volledige normdekking.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Maximaal de honderd meest recente concepten en besluiten.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssuranceFrameworkDraft" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/assurance-framework-drafts/ai:
    post:
      tags: [Assurance, AI]
      summary: Brongebonden high-level kaderconcept met AI voorbereiden.
      description: >
        De backend haalt de bron-URL nooit op. AI ontvangt uitsluitend de
        zelfgeschreven publieke samenvatting. Ongeldige of niet-geconfigureerde
        AI-uitvoer wordt fail-closed geweigerd en nooit gepubliceerd.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssuranceFrameworkDraftCreate" }
      responses:
        "201":
          description: Niet-gepubliceerd concept aangemaakt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssuranceFrameworkDraft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: Rechtenbevestiging ontbreekt. }
        "502": { description: Provideruitvoer is ongeldig of provider onbereikbaar. }
        "503": { description: AI is niet expliciet geconfigureerd. }

  /admin/assurance-framework-drafts/{draftId}/publish:
    parameters:
      - name: draftId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    post:
      tags: [Assurance]
      summary: Concept na drie expliciete menselijke controles publiceren.
      description: Publicatie maakt het kader catalogusbeschikbaar maar nooit automatisch actief.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssuranceFrameworkDraftPublish" }
      responses:
        "200":
          description: Gepubliceerd, niet geactiveerd.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssuranceFrameworkDraft" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: Eén of meer verplichte publicatiechecks ontbreken. }

  /admin/assurance-framework-drafts/{draftId}/reject:
    parameters:
      - name: draftId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    post:
      tags: [Assurance]
      summary: Fout of onbruikbaar AI-concept auditbaar afwijzen.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssuranceFrameworkDraftReject" }
      responses:
        "200":
          description: Afgewezen concept; niet catalogusbeschikbaar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssuranceFrameworkDraft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /assurance/frameworks:
    get:
      tags: [Assurance]
      summary: Openbare kadermetadata en hoog-over evidencevragen ophalen.
      description: Bevat bewust geen ISO-normtekst of conformiteitsclaim.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Catalogus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssuranceFrameworkCatalog" }

  /assurance/questionnaires:
    get:
      tags: [Assurance]
      summary: Readiness-vragenlijstsessies ophalen.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - name: frameworkId
          in: query
          schema: { $ref: "#/components/schemas/AssuranceFrameworkId" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Sessies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssuranceQuestionnaire" }
    post:
      tags: [Assurance]
      summary: Een revisiegebonden readiness-vragenlijst starten.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssuranceQuestionnaireStart" }
      responses:
        "201":
          description: Gestart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssuranceQuestionnaire" }
        "409": { $ref: "#/components/responses/Conflict" }

  /assurance/questionnaires/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    get:
      tags: [Assurance]
      summary: Eén readiness-vragenlijstsessie ophalen.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Sessie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssuranceQuestionnaire" }
        "404": { $ref: "#/components/responses/NotFound" }

  /assurance/questionnaires/{sessionId}/answers:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    post:
      tags: [Assurance]
      summary: Eén evidenceantwoord met optimistic concurrency vastleggen.
      description: Antwoord ja vereist bewijs; nvt vereist een gemotiveerde menselijke keuze.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssuranceQuestionnaireAnswerRequest" }
      responses:
        "200":
          description: Bijgewerkte sessie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssuranceQuestionnaire" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /assurance/monitoring/status:
    get:
      tags: [Assurance]
      summary: Due-status en laatste continue-assurancerun ophalen.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssuranceMonitoringStatus" }

  /assurance/runs:
    get:
      tags: [Assurance]
      summary: Assurance-runs en hun deterministische bevindingen ophalen.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssuranceRun" }
    post:
      tags: [Assurance]
      summary: Een handmatige deterministische readinesscontrole uitvoeren.
      description: Dit is geen formeel audit- of certificeringsbesluit.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Afgeronde run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssuranceRun" }
        "409": { $ref: "#/components/responses/Conflict" }

  /assurance/runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    get:
      tags: [Assurance]
      summary: Eén assurance-run ophalen.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssuranceRun" }
        "404": { $ref: "#/components/responses/NotFound" }

  /iso/overview:
    get:
      tags: [ISO]
      summary: ISO-schema, auditmatrix en borging-signalen.
      parameters:
        - name: norm
          in: query
          schema: { $ref: "#/components/schemas/IsoNorm" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IsoOverview" }

  /processes/{id}/iso:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [ISO]
      summary: ISO-/borgingconfiguratie van de actuele werkversie. Vereist een redactierol.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IsoProcessConfig" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [ISO]
      summary: ISO-/borgingconfiguratie van één proces wijzigen. Vereist rol 'bewerken'.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IsoProcessConfig" }
      responses:
        "200":
          description: Bijgewerkt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IsoProcessConfig" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /processes/{id}/audit/start:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [ISO]
      summary: Start een menselijke kaderbeoordeling voor de actuele procesrevisie.
      description: >
        De backend stempelt actor, tijd en procesrevisie. Dit start audittriage en
        is nadrukkelijk geen certificeringsbesluit. Vereist een redactierol.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditAssessmentStartRequest" }
      responses:
        "200":
          description: Beoordeling gestart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditAssessmentStart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /processes/{id}/audit/confirmations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [ISO]
      summary: Leg één menselijke controle-uitkomst met onderbouwing vast.
      description: >
        Actor, tijd en procesrevisie worden uitsluitend door de backend gezet.
        Uitkomst 'voldoet' vereist een bewijsreferentie. Een bevestiging is
        traceerbare auditinformatie en geen certificering.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditConfirmationRequest" }
      responses:
        "200":
          description: Menselijke beoordeling vastgelegd
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditConfirmation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /iso/export:
    get:
      tags: [ISO]
      summary: ISO-auditmatrix exporteren als CSV of JSON.
      parameters:
        - name: norm
          in: query
          schema: { $ref: "#/components/schemas/IsoNorm" }
        - name: format
          in: query
          schema: { type: string, enum: [csv, json], default: csv }
      responses:
        "200":
          description: Exportbestand
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/IsoOverview" }

  /admin/ai-instellingen:
    get:
      tags: [AI]
      summary: Veilige provider-/activatiestatus zonder providercredential.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Actuele effectieve configuratie en niet-gevoelige credentialmetadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSettingsStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [AI]
      summary: Provider, expliciet model en activatiemodus wijzigen.
      description: >
        apiKey bestaat tijdelijk voor backwards-compatibiliteit en wordt bij
        ontvangst direct naar de versleutelde tenant-BYO-opslag geroteerd; deze
        request wordt daardoor effectief mode=byo. De response bevat de waarde
        nooit. Managed AI gebruikt uitsluitend het centrale platformprofiel.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiSettingsUpdate" }
      responses:
        "200":
          description: Bijgewerkte veilige status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSettingsStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/ai-instellingen/credential/rotate:
    post:
      tags: [AI]
      summary: Tenantgebonden BYO-providercredential veilig roteren.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiCredentialRotateRequest" }
      responses:
        "200":
          description: Veilige status met nieuwe fingerprint en rotatietijd.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSettingsStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/ai-instellingen/credential/revoke:
    post:
      tags: [AI]
      summary: Tenantgebonden BYO-providercredential intrekken en AI fail-closed uitschakelen.
      description: Een centraal Managed AI-platformcredential wordt nooit vanuit deze route ingetrokken.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "204": { description: Ingetrokken en uitgeschakeld. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/ai-instellingen/credential/clear:
    post:
      tags: [AI]
      summary: Compatibele alias voor credential/revoke.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "204": { description: Ingetrokken en uitgeschakeld. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/ai-instellingen/test:
    post:
      tags: [AI]
      summary: Providerverbinding testen zonder procesinhoud mee te sturen.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Connectietest geslaagd.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiConnectionTestResult" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502":
          description: Provider niet bereikbaar of aanvraag afgewezen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Entra ID-token (gekoppelde modus).
    cookieAuth:
      type: apiKey
      in: cookie
      name: spg_session
      description: Sessiecookie (zelfstandige modus).

  responses:
    BadRequest:
      description: Ongeldige aanvraag of route niet beschikbaar in de huidige modus.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Niet ingelogd.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Onvoldoende rechten.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Niet gevonden.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict met bestaande data.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    WorkflowRevisionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
          description: Revisie van het document dat de gebruiker heeft bekeken; stale revisies geven 409.
        opmerking: { type: string }
    Error:
      type: object
      required: [code, bericht]
      properties:
        code: { type: string }
        bericht: { type: string }

    Role:
      type: string
      enum: [kijken, suggesties, bewerken, goedkeuren, beheren]

    User:
      type: object
      required: [id, naam, bron, rollen]
      properties:
        id: { type: string }
        naam: { type: string }
        email: { type: string }
        bron: { type: string, enum: [entra, local, development-bypass] }
        rollen:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        groepen:
          type: array
          items: { type: string }

    LocalUser:
      type: object
      required: [id, gebruikersnaam, naam, rollen, actief, aangemaaktOp]
      properties:
        id: { type: string }
        gebruikersnaam: { type: string }
        naam: { type: string }
        email: { type: string, format: email }
        rollen:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        actief: { type: boolean }
        aangemaaktOp: { type: string, format: date-time }
        gewijzigdOp: { type: string, format: date-time }

    LocalUserCreateRequest:
      type: object
      required: [gebruikersnaam, naam, wachtwoord, rollen]
      properties:
        gebruikersnaam: { type: string }
        naam: { type: string }
        email: { type: string, format: email }
        wachtwoord: { type: string, format: password }
        rollen:
          type: array
          items: { $ref: "#/components/schemas/Role" }
