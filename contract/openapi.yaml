        storage: { type: string, enum: [db, local] }
        online: { type: boolean }
        versie: { type: string }
        entra: { $ref: "#/components/schemas/EntraPublicConfig" }
        runtime: { $ref: "#/components/schemas/RuntimeConfig" }

    RuntimeConfig:
      type: object
