        developmentLoginAvailable:
          type: boolean
          description: Alleen true voor de expliciete, lokaal begrensde development-session.

    AiMode:
      type: string
      enum: [disabled, managed, byo]

    AiActivationState:
      type: string
      enum:
        [disabled, active, missing-credential, invalid-configuration,
         managed-unavailable, legacy-disabled]

    AiLegacyOAuthStatus:
      type: object
      required: [available, linked, productionAllowed]
      properties:
        available: { type: boolean }
        linked: { type: boolean }
        productionAllowed: { type: boolean, enum: [false] }

    AiManagedCapability:
      type: object
      required: [available, reasonCode, nextStep]
      properties:
        available: { type: boolean }
        reasonCode:
          type: string
          description: Niet-gevoelige machinecode voor beschikbaarheid of blokkade.
        nextStep:
          type: string
          description: Concrete beheeractie; bevat nooit credentialmateriaal.

    AiSettingsStatus:
      type: object
      required:
        [provider, endpoint, model, mode, heeftSleutel, geconfigureerd,
         activationState, credentialSource, storedTenantCredentialPresent,
         legacy, productionAllowed, canTest, managedAi, legacyOAuth]
      properties:
        provider: { type: string, enum: [disabled, azure-openai, openai, anthropic, chatgpt, invalid] }
        endpoint: { type: string }
        model: { type: string }
        mode: { $ref: "#/components/schemas/AiMode" }
        heeftSleutel: { type: boolean }
        geconfigureerd: { type: boolean }
        activationState: { $ref: "#/components/schemas/AiActivationState" }
        credentialSource:
          type: string
          description: >
            tenant-protected is een write-only organisatiecredential;
            server-configuration is uitsluitend het centrale Managed AI-profiel.
          enum: [none, tenant-protected, server-configuration, legacy-oauth]
        credentialFingerprint:
          type: string
          pattern: "^sha256:[0-9a-f]{12}$"
        credentialUpdatedAt: { type: string, format: date-time }
        storedTenantCredentialPresent:
          type: boolean
          description: >
            Er staat een write-only tenantcredential opgeslagen, ook wanneer
            disabled of Managed AI hem momenteel niet gebruikt.
        storedTenantCredentialProvider:
          type: string
          enum: [azure-openai, openai, anthropic]
          description: >
            Provider waaraan de opgeslagen tenantcredential expliciet is
            gebonden. Ontbrekend betekent fail-closed:
            registreer een nieuwe credential voordat BYO actief kan worden.
        errorCode: { type: string }
        legacy: { type: boolean }
        productionAllowed: { type: boolean }
        canTest: { type: boolean }
        managedAi: { $ref: "#/components/schemas/AiManagedCapability" }
        legacyOAuth: { $ref: "#/components/schemas/AiLegacyOAuthStatus" }

    AiSettingsUpdate:
      type: object
      properties:
        provider: { type: string, enum: [disabled, azure-openai, openai, anthropic, chatgpt] }
        endpoint:
          type: string
          description: Alleen officiële Azure OpenAI-/Azure AI Services-HTTPS-basishosts.
        model:
          type: string
          description: Verplicht en expliciet zodra mode niet disabled is.
        mode: { $ref: "#/components/schemas/AiMode" }
        apiKey:
          type: string
          format: password
          writeOnly: true
          deprecated: true

    AiCredentialRotateRequest:
      type: object
      required: [secret]
      properties:
        secret:
          type: string
          format: password
          writeOnly: true
          minLength: 1

    AiConnectionTestResult:
      type: object
      required: [ok, provider, model, testedAt]
      properties:
        ok: { type: boolean, enum: [true] }
        provider: { type: string }
        model: { type: string }
        testedAt: { type: string, format: date-time }

    ProcessMaintenanceTrigger:
      type: object
      additionalProperties: false
      required: [soort]
      properties:
        soort: { type: string, enum: [handmatig, health, kader, suggestie] }
        referentieId: { type: [string, "null"] }
        kaderId: { type: [string, "null"] }
        titel: { type: [string, "null"] }
        beschrijving: { type: [string, "null"] }

    ProcessMaintenanceAnalysisRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        doel: { type: [string, "null"], maxLength: 1000 }
        stapIds:
          type: [array, "null"]
          maxItems: 50
          items: { type: string }
        aanleiding:
          oneOf:
            - { $ref: "#/components/schemas/ProcessMaintenanceTrigger" }
            - { type: "null" }
        antwoorden:
          type: [object, "null"]
          maxProperties: 5
          additionalProperties: { type: string, minLength: 1, maxLength: 2000 }

    ProcessMaintenanceQuestion:
      type: object
      additionalProperties: false
      required: [id, vraag, waarom, stapId, bronIds]
      properties:
        id: { type: string }
        vraag: { type: string }
        waarom: { type: string }
        stapId: { type: [string, "null"] }
        bronIds: { type: array, items: { type: string } }

    ProcessMaintenanceIssue:
      type: object
      additionalProperties: false
      required: [id, stapId, categorie, ernst, titel, bevinding, uitleg, bronIds]
      properties:
        id: { type: string }
        stapId: { type: [string, "null"] }
        categorie:
          type: string
          enum: [onduidelijkheid, verantwoordelijkheid, proceslogica, beheersing,
                 bewijs, systeem, termijn, consistentie]
        ernst: { type: string, enum: [info, waarschuwing, fout] }
        titel: { type: string }
        bevinding: { type: string }
        uitleg: { type: string }
        bronIds: { type: array, items: { type: string } }

    ProcessMaintenanceField:
      type: string
      enum: [activiteit, toelichting, opmerking, zijnotitie, voorwaarde,
             erpStatus, termijn, waarschuwing]

    ProcessMaintenanceChange:
      type: object
      additionalProperties: false
      required: [id, stapId, veld, oudeWaarde, nieuweWaarde, reden,
                 bevestigingVereist, bronIds]
      properties:
        id: { type: string }
        stapId: { type: string }
        veld: { $ref: "#/components/schemas/ProcessMaintenanceField" }
        oudeWaarde: { type: [string, "null"] }
        nieuweWaarde: { type: [string, "null"] }
        reden: { type: string }
        bevestigingVereist: { type: boolean, const: true }
        bronIds: { type: array, items: { type: string } }

    ProcessMaintenanceSource:
      type: object
      additionalProperties: false
      required: [id, type, procesId, processRevision, stapId, veld, label, contentHash]
      properties:
        id: { type: string }
        type: { type: string }
        procesId: { type: string }
        processRevision: { type: integer, minimum: 1 }
        stapId: { type: [string, "null"] }
        veld: { type: [string, "null"] }
        label: { type: string }
        contentHash: { type: string }

    ProcessMaintenanceAnalysis:
      type: object
      additionalProperties: false
      required: [schemaVersion, runId, procesId, processRevision, status,
                 samenvatting, bronIds, vragen, issues, wijzigingen, bronnen]
      properties:
        schemaVersion: { type: string, const: process-maintenance.v1 }
        runId: { type: string }
        procesId: { type: string }
        processRevision: { type: integer, minimum: 1 }
        status: { type: string, enum: [vragen, voorstel, geen-wijziging] }
        samenvatting: { type: string }
        bronIds: { type: array, items: { type: string } }
        vragen:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/ProcessMaintenanceQuestion" }
        issues:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ProcessMaintenanceIssue" }
        wijzigingen:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ProcessMaintenanceChange" }
        bronnen:
          type: array
          items: { $ref: "#/components/schemas/ProcessMaintenanceSource" }

    AiRunFeedbackRequest:
      type: object
      additionalProperties: false
      required: [beslissing]
      properties:
        beslissing: { type: string, enum: [accepted, rejected] }
        reden:
          type: string
          minLength: 1
          maxLength: 160
          description: Privacybegrensde auditreden; geen contactgegevens, links, lange nummers of regeleinden.
        geaccepteerdeWijzigingIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 160
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$"

    AiRunFeedback:
      type: object
      additionalProperties: false
      required: [beslissing, geaccepteerdeWijzigingIds, doorGebruiker, op]
      properties:
        beslissing: { type: string, enum: [accepted, rejected] }
        reden: { type: string, minLength: 1, maxLength: 160 }
        geaccepteerdeWijzigingIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 160
            description: Eenrichtingsgehashte, ledger-interne wijziging-id.
        doorGebruiker: { type: string }
        op: { type: string, format: date-time }

    AiRun:
      type: object
      additionalProperties: false
      required: [runId, capability, procesId, processRevision, status,
                 gestartDoor, gestartOp, vraagAantal, issueAantal, wijzigingAantal]
      properties:
        runId:
          type: string
          pattern: "^[0-9a-fA-F]{32}$"
        capability: { type: string, const: process-maintenance }
        procesId: { type: string }
        processRevision: { type: integer, minimum: 1 }
        status: { type: string, enum: [running, completed, failed, stale, cancelled] }
        resultaatStatus: { type: string, enum: [vragen, voorstel, geen-wijziging] }
        provider: { type: [string, "null"] }
        model: { type: [string, "null"] }
        gestartDoor: { type: string }
        gestartOp: { type: string, format: date-time }
        afgerondOp: { type: string, format: date-time }
        duurMs: { type: integer, format: int64, minimum: 0 }
        inputHash:
          type: string
          pattern: "^sha256:[0-9a-fA-F]{64}$"
        outputHash:
          type: string
          pattern: "^sha256:[0-9a-fA-F]{64}$"
        vraagAantal: { type: integer, minimum: 0, maximum: 5 }
        issueAantal: { type: integer, minimum: 0, maximum: 20 }
        wijzigingAantal: { type: integer, minimum: 0, maximum: 20 }
        foutcode: { type: string, maxLength: 120 }
        feedback: { $ref: "#/components/schemas/AiRunFeedback" }

    Lane:
